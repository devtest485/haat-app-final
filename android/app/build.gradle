plugins {
   id "com.android.application"
   id "kotlin-android"
   id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Tap to pay: the AID list HaatTapService answers for. FlutterFlow exposes no res/
// file to put it in, so it is written here, into build/, on every build.
//
// The tap itself is the `other` group: Android sends HAAT's own AID to HAAT whichever
// wallet is the default, so a tap works with Google Wallet or another wallet chosen.
// The `payment` group, an AID of HAAT's that nothing selects, is only so HAAT is
// listed under Settings › Default wallet app; choosing it there changes nothing for
// HAAT's tap.
//
// Neither unlocked nor screen-on is required here: whether a locked phone, or one with
// HAAT closed, answers a tap is the owner's choice under Security, and HaatTapService
// refuses the tap itself when it is off. (requireDeviceScreenOn is read from Android 12
// on; older phones only answer with the screen on.)
def tapResources = new File(layout.buildDirectory.get().asFile, 'generated/haat-tap/res')
new File(tapResources, 'xml').mkdirs()
new File(tapResources, 'values').mkdirs()
new File(tapResources, 'drawable').mkdirs()
new File(tapResources, 'xml/haat_tap_service.xml').text = '''<?xml version="1.0" encoding="utf-8"?>
<host-apdu-service xmlns:android="http://schemas.android.com/apk/res/android"
    android:description="@string/haat_tap_description"
    android:apduServiceBanner="@mipmap/ic_launcher"
    android:requireDeviceUnlock="false"
    android:requireDeviceScreenOn="false">
    <aid-group android:category="other" android:description="@string/haat_tap_description">
        <aid-filter android:name="F048414154504159"/>
    </aid-group>
    <aid-group android:category="payment" android:description="@string/haat_tap_description">
        <aid-filter android:name="F04841415457414C"/>
    </aid-group>
</host-apdu-service>
'''
// The status-bar icon of the notification a phone paid by tap while locked gets.
new File(tapResources, 'drawable/haat_tap_notification.xml').text = '''<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="24dp" android:height="24dp"
    android:viewportWidth="24" android:viewportHeight="24">
    <path android:fillColor="#FFFFFFFF"
        android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM10,17l-5,-5 1.41,-1.41L10,14.17l7.59,-7.59L19,8l-9,9z"/>
</vector>
'''
new File(tapResources, 'values/haat_tap.xml').text = '''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="haat_tap_description">HAAT tap to pay</string>
</resources>
'''

android {
    namespace "com.mycompany.haat"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.res.srcDirs += tapResources
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.mycompany.haat"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

   signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
   }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
    // The system fingerprint/face sheet, and the CryptoObject that binds it to a
    // Keystore key — see BiometricKeyBridge.
    implementation "androidx.biometric:biometric:1.1.0"
}