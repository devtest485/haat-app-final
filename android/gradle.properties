org.gradle.jvmargs=-Xmx6144m
android.useAndroidX=true
android.enableJetifier=true
android.enableR8=true
kotlin.jvm.target.validation.mode = IGNORE

# The pub cache sits on C: and this project on D:, and Kotlin's incremental compiler
# relativises plugin sources against the project root — which cannot be done across two
# drives ("this and base files have different roots"). Every plugin then fails to close
# its caches, throws a page of stack trace, and falls back to a full compile anyway. The
# fallback is what actually builds, so this just asks for it directly.
kotlin.incremental=false
